<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>颱洪整備教室 - LMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .gradient-text { background: linear-gradient(to right, #2dd4bf, #0ea5e9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .no-select { -webkit-user-select: none; user-select: none; }
        .sidebar-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex antialiased">

    <aside id="sidebarNav" class="w-16 hover:w-64 bg-slate-900 border-r border-slate-800 p-4 flex flex-col shrink-0 no-select sidebar-transition group relative z-50 fixed h-full top-0 left-0">
        <div class="flex items-center gap-3 font-bold text-lg mb-8 overflow-hidden whitespace-nowrap pl-1">
            <span class="text-xl">🛡️</span><span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-blue-400">防災學習 LMS</span>
        </div>
        <nav class="space-y-4 flex-1 overflow-y-auto pr-1">
            <div>
                <div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pl-2">主選單</div>
                <a href="index.html" class="flex items-center gap-4 text-gray-400 hover:text-white p-2.5 rounded-xl hover:bg-slate-800 transition whitespace-nowrap pl-2"><span class="text-lg">🏠</span><span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm">學習中控大廳</span></a>
            </div>
            <div>
                <div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pl-2">實體備料</div>
                <a href="calculator.html" class="flex items-center gap-4 text-gray-400 hover:text-purple-400 p-2.5 rounded-xl hover:bg-slate-800 transition whitespace-nowrap pl-2"><span class="text-lg">🧮</span><span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm">智慧物資準備</span></a>
            </div>
            <div>
                <div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pl-2">核心災害教室</div>
                <div class="space-y-1">
                    <a href="earthquake.html" class="flex items-center gap-4 text-gray-400 hover:text-blue-400 p-2 rounded-xl hover:bg-slate-800 transition whitespace-nowrap pl-2"><span class="text-lg">🫨</span><span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm">地震應變教室</span></a>
                    <a href="#" class="flex items-center gap-4 text-teal-400 bg-teal-950/40 p-2 rounded-xl border border-teal-900/30 whitespace-nowrap pl-2"><span class="text-lg">🌀</span><span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm font-bold">颱洪整備教室</span></a>
                    <a href="fire.html" class="flex items-center gap-4 text-gray-400 hover:text-red-400 p-2 rounded-xl hover:bg-slate-800 transition whitespace-nowrap pl-2"><span class="text-lg">🔥</span><span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm">火災安全逃生</span></a>
                </div>
            </div>
            <div>
                <div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pl-2">生活安全教室</div>
                <div class="space-y-1">
                    <a href="home-safety.html" class="flex items-center gap-4 text-gray-400 hover:text-yellow-400 p-2 rounded-xl hover:bg-slate-800 transition whitespace-nowrap pl-2"><span class="text-lg">🚪</span><span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm">居家綜合安全</span></a>
                    <a href="first-aid.html" class="flex items-center gap-4 text-gray-400 hover:text-emerald-400 p-2 rounded-xl hover:bg-slate-800 transition whitespace-nowrap pl-2"><span class="text-lg">🚑</span><span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm">民眾急救自救</span></a>
                </div>
            </div>
        </nav>
    </aside>

    <main class="flex-1 ml-16 p-6 md:p-8 overflow-y-auto">
        <div class="max-w-4xl mx-auto">
            <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-3xl font-black mb-2 gradient-text">🌀 颱洪災害整備教室</h1>
                    <p class="text-gray-400 text-xs">專攻防颱整備、土石流警戒與強制撤離前置作業。</p>
                </div>
                <span class="bg-teal-950 text-teal-400 text-xs px-3 py-1 rounded-full font-bold border border-teal-900/50 no-select whitespace-nowrap">颱洪災害防救手冊對齊</span>
            </header>

            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl mb-6 flex flex-col md:flex-row gap-6 items-center">
                <div class="flex-1">
                    <h2 class="text-md font-bold text-gray-200 mb-2">📖 課本參閱：防颱整備指引</h2>
                    <p class="text-xs text-gray-400 leading-relaxed">
                        颱風來臨前，請務必清理排水溝、固定陽台盆栽並備妥 7 天份飲用水。請勾選下方清單以確保各項準備到位！
                    </p>
                </div>
                <a href="files/防災宣導教學手冊-颱洪災害防救-new.pdf" target="_blank" class="w-full md:w-auto bg-teal-600 hover:bg-teal-500 text-white font-bold py-3.5 px-5 rounded-xl transition-all flex justify-center items-center gap-2 group cursor-pointer border border-teal-400 text-sm whitespace-nowrap">
                    <span class="text-xl">📘</span> 開啟防颱課本
                </a>
            </div>

            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl mb-6">
                <h3 class="text-md font-bold text-teal-400 mb-4 flex items-center gap-2">✅ 訓練一：防颱前夕整備清單</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <label class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex items-center gap-3 cursor-pointer hover:border-slate-600">
                        <input type="checkbox" class="w-5 h-5 rounded border-slate-600 bg-slate-800 text-teal-500 focus:ring-0">
                        <span class="text-sm font-bold text-gray-300">固定陽台盆栽與懸掛物</span>
                    </label>
                    <label class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex items-center gap-3 cursor-pointer hover:border-slate-600">
                        <input type="checkbox" class="w-5 h-5 rounded border-slate-600 bg-slate-800 text-teal-500 focus:ring-0">
                        <span class="text-sm font-bold text-gray-300">清理住家排水溝與落水孔</span>
                    </label>
                    <label class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex items-center gap-3 cursor-pointer hover:border-slate-600">
                        <input type="checkbox" class="w-5 h-5 rounded border-slate-600 bg-slate-800 text-teal-500 focus:ring-0">
                        <span class="text-sm font-bold text-gray-300">確認窗戶緊閉並貼妥膠帶</span>
                    </label>
                    <label class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex items-center gap-3 cursor-pointer hover:border-slate-600">
                        <input type="checkbox" class="w-5 h-5 rounded border-slate-600 bg-slate-800 text-teal-500 focus:ring-0">
                        <span class="text-sm font-bold text-gray-300">備妥手電筒、電池與收音機</span>
                    </label>
                </div>
            </div>

            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
                <h3 class="text-md font-bold text-teal-400 mb-2 flex items-center gap-2">💬 訓練二：防颱文本 AI 智能詢問區</h3>
                <div class="space-y-4">
                    <textarea id="userInquiryInput" rows="3" class="w-full bg-slate-950 border border-slate-800 focus:border-teal-500 rounded-xl p-4 text-sm text-gray-200" placeholder="詢問防颱問題..."></textarea>
                    <button onclick="submitInquiry()" id="sendInquiryBtn" class="bg-teal-600 hover:bg-teal-500 text-white font-bold py-2.5 px-6 rounded-xl transition text-xs">送出詢問</button>
                </div>
                <div id="inquiryResponseBox" class="hidden mt-6 p-5 bg-slate-950 border border-slate-800 rounded-xl">
                    <p id="inquiryResponseText" class="text-xs text-gray-300"></p>
                </div>
            </div>
        </div>
    </main>
    <script>
        // (同前述邏輯...)
        async function submitInquiry() {
            const question = document.getElementById('userInquiryInput').value;
            const responseText = document.getElementById('inquiryResponseText');
            document.getElementById('inquiryResponseBox').classList.remove('hidden');
            responseText.innerText = "🤖 AI 導師分析中：" + (question.includes("膠帶") ? "窗戶貼膠帶主要是防止玻璃破碎飛散，無法增加抗風強度。" : "請保持居家周遭排水通暢，並備足物資。");
        }
    </script>
</body>
</html>
