<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 智慧防災 LMS 系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen font-sans">

    <div class="bg-slate-800 p-10 rounded-2xl border border-slate-700 shadow-2xl w-full max-w-md relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-500 rounded-full mix-blend-multiply filter blur-2xl opacity-20"></div>
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-white mb-2">🛡️ Disaster LMS</h1>
            <p class="text-gray-400 text-sm">次世代引導式防災學習平台</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">學生帳號 (Email)</label>
                <input type="email" value="yixiang@school.edu.tw" class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">密碼</label>
                <input type="password" value="********" class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" required>
            </div>
            
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-gray-400">
                    <input type="checkbox" class="mr-2 rounded border-gray-600 bg-slate-800" checked> 記住我
                </label>
                <a href="#" class="text-blue-400 hover:text-blue-300">忘記密碼？</a>
            </div>

            <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-lg mt-4 flex justify-center items-center">
                登入系統
            </button>
        </form>

        <p class="mt-8 text-center text-sm text-gray-500">
            還沒有帳號嗎？ <a href="#" class="text-blue-400 hover:text-blue-300 font-medium">聯繫助教註冊</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // 阻止真實表單送出
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                驗證身分中...
            `;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            // 假裝跟資料庫連線 1.5 秒，然後跳轉到你的中控台！
            setTimeout(() => {
                window.location.href = 'index.html'; 
            }, 1500);
        });
    </script>
</body>
</html>
