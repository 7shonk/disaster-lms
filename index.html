</head>
<body class="bg-slate-950 text-white min-h-screen flex font-sans antialiased">

    <aside id="sidebarNav" class="w-16 hover:w-64 bg-slate-900 border-r border-slate-800 p-4 flex flex-col shrink-0 no-select sidebar-transition group relative z-50">
        <div class="flex items-center gap-3 font-bold text-lg mb-8 overflow-hidden whitespace-nowrap pl-1">
            <span class="text-xl">🛡️</span>
            <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-blue-400">防災學習 LMS</span>
        </div>
        <nav class="space-y-4 flex-1 overflow-y-auto pr-1">
            <div>
                <div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pl-2">主選單</div>
                <a href="#" class="flex items-center gap-4 text-blue-400 bg-blue-950/40 p-2.5 rounded-xl border border-blue-900/30 whitespace-nowrap pl-2">
                    <span class="text-lg">🏠</span>
                    <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm font-semibold">學習中控大廳</span>
                </a>
            </div>
            <div>
                <div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pl-2">實體備料</div>
                <a href="calculator.html" class="flex items-center gap-4 text-gray-400 hover:text-purple-400 p-2.5 rounded-xl hover:bg-slate-800 transition whitespace-nowrap pl-2">
                    <span class="text-lg">🧮</span>
                    <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm">智慧物資準備</span>
                </a>
            </div>
            <div>
                <div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pl-2">核心災害教室</div>
                <div class="space-y-1">
                    <a href="earthquake.html" class="flex items-center gap-4 text-gray-400 hover:text-blue-400 p-2 rounded-xl hover:bg-slate-800 transition whitespace-nowrap pl-2"><span class="text-lg">🫨</span><span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm">地震應變教室</span></a>
                    <a href="typhoon.html" class="flex items-center gap-4 text-gray-400 hover:text-teal-400 p-2 rounded-xl hover:bg-slate-800 transition whitespace-nowrap pl-2"><span class="text-lg">🌀</span><span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm">颱洪整備教室</span></a>
                    <a href="fire.html" class="flex items-center gap-4 text-gray-400 hover:text-red-400 p-2 rounded-xl hover:bg-slate-800 transition whitespace-nowrap pl-2"><span class="text-lg">🔥</span><span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm">火災安全逃生</span></a>
                </div>
            </div>
        </nav>

        <div class="border-t border-slate-800 pt-4 mt-auto overflow-hidden">
            <div id="userEmailDisplay" class="text-xs text-gray-400 mb-3 truncate pl-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300">🎓 學生：讀取中...</div>
            <button onclick="logout()" class="w-full text-left text-red-400 hover:text-red-300 text-sm font-bold flex items-center gap-4 p-2.5 rounded-xl transition pl-2 hover:bg-red-500/10">
                <span class="text-lg">🚪</span>
                <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300">登出系統</span>
            </button>
        </div>
    </aside>

    <main class="flex-1 p-5 md:p-8 overflow-y-auto w-full">
        <div class="max-w-6xl mx-auto w-full">
            
            <header class="mb-6 border-b border-slate-800 pb-4 no-select px-4 md:px-0">
                <h1 class="text-2xl md:text-3xl font-black mb-1">智慧防災學習大廳</h1>
                <p class="text-gray-400 text-xs">六大主題互動式數位教室樞紐・跨系統用戶生態帳號即時連動</p>
            </header>

            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-lg mb-8 relative overflow-hidden">
                <div class="flex flex-col gap-6">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-800 pb-4">
                        <div class="no-select">
                            <h2 class="text-md font-bold text-blue-400 mb-1">📋 步驟一：家庭實體物資智慧盤點</h2>
                            <p class="text-xs text-gray-400">iOS App 掃描後的 AI 健檢報告如下：</p>
                        </div>
                        <div class="w-full md:w-80 bg-slate-950/80 p-4 rounded-xl border border-slate-800 text-center">
                            <h2 class="text-xs text-gray-500 mb-1 font-medium">✅ 實體包 App 掃描完成率</h2>
                            <div class="text-5xl font-black text-sky-400 tracking-tight" id="scoreDisplay">--</div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 bg-slate-950/60 border border-slate-800/80 p-5 rounded-xl">
                            <h3 class="text-xs font-bold text-yellow-500 mb-3 uppercase tracking-wider">💡 AI 即時專家優化建議</h3>
                            <p id="aiFeedbackText" class="text-xs text-gray-400 leading-relaxed italic">等待盤點資料同步...</p>
                        </div>
                        
                        <div class="lg:col-span-1 flex flex-col gap-3">
                            <div class="bg-red-950/20 border border-red-900/30 p-4 rounded-xl">
                                <span class="text-[10px] font-bold text-red-400 block mb-2">❌ 缺失物資</span>
                                <div id="missingItemsList" class="text-[11px] text-gray-300"></div>
                            </div>
                            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                                <span class="text-[10px] font-bold text-yellow-500 block mb-2">📦 建議精簡之物資</span>
                                <div id="overstockedItemsList" class="text-[11px] text-gray-300"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <h2 class="text-sm font-bold text-gray-400 mb-4 uppercase tracking-wider">🚪 教室入口</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <a href="earthquake.html" class="bg-slate-900 p-4 rounded-xl border border-slate-800 hover:border-blue-500 transition text-sm font-bold">🫨 地震防護教室</a>
                <a href="typhoon.html" class="bg-slate-900 p-4 rounded-xl border border-slate-800 hover:border-teal-500 transition text-sm font-bold">🌀 颱洪整備教室</a>
                <a href="fire.html" class="bg-slate-900 p-4 rounded-xl border border-slate-800 hover:border-red-500 transition text-sm font-bold">🔥 火災安全教室</a>
            </div>
        </div>
    </main>

    <script>
        const supabaseUrl = 'https://ovyygcsuiwwbgoywplbq.supabase.co';
        const supabaseKey = 'sb_publishable_Rfekybrmzpc7rjaHAq5Q8Q_ChnHYcAI'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        
        let testUserId = null; 

        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'register.html'; return; }
            testUserId = session.user.id;

            const { data: profile } = await supabaseClient.from('lms_disaster_progress')
                .select('student_name').eq('user_id', testUserId).maybeSingle();
            
            document.getElementById('userEmailDisplay').innerText = `🎓 學生：${profile?.student_name || session.user.email.split('@')[0]}`;
            
            fetchLatestProgress();
            setInterval(fetchLatestProgress, 3000); 
        }

        async function fetchLatestProgress() {
            if (!testUserId) return;
            const { data, error } = await supabaseClient.from('lms_disaster_progress')
                .select('*')
                .eq('user_id', testUserId)
                .order('updated_at', { ascending: false })
                .limit(1);

            if (data && data.length > 0 && !error) {
                updateUI(data[0]);
            }
        }

        function updateUI(data) {
            document.getElementById('scoreDisplay').innerText = data.disaster_kit_score || 0;
            document.getElementById('aiFeedbackText').innerText = data.ai_feedback || "尚未盤點，請使用 App 進行拍照。";
            
            // 渲染清單
            const mList = document.getElementById('missingItemsList');
            const oList = document.getElementById('overstockedItemsList');
            
            mList.innerHTML = (data.missing_items || []).length > 0 
                ? data.missing_items.map(i => `<div class="mb-1">• ${i}</div>`).join('') 
                : "無缺失項目 🎉";
                
            oList.innerHTML = (data.overstocked_items || []).length > 0 
                ? data.overstocked_items.map(i => `<div class="mb-1">• ${i}</div>`).join('') 
                : "無過多贅物 👍";
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'register.html';
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
