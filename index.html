<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>防災萬用包 - 智慧學習儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white p-6 font-sans">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8 border-b border-slate-700 pb-4">
            <h1 class="text-4xl font-bold mb-2">🌪️ 防災學習智慧中控台 <span class="text-sm font-normal text-blue-400 bg-blue-900/30 px-3 py-1 rounded-full">Pro 版</span></h1>
            <p class="text-gray-400">引導式情境教學模組・連動個人化資料庫</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg md:col-span-1 flex flex-col justify-center items-center text-center">
                <h2 class="text-lg text-gray-300 mb-2">實體防災包掃描分數</h2>
                <div class="flex items-baseline gap-2">
                    <div id="scoreDisplay" class="text-6xl font-extrabold text-blue-400">--</div>
                    <div class="text-lg text-gray-400">/ 100</div>
                </div>
                <p id="statusMessage" class="mt-3 text-sm text-yellow-400">讀取中...</p>
            </div>

            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg md:col-span-2">
                <h2 class="text-lg text-gray-300 mb-4">🧠 認知與預防教學進度</h2>
                <div class="grid grid-cols-3 gap-4 text-center">
                    <div class="bg-slate-700/50 p-4 rounded-lg">
                        <div class="text-2xl mb-1">🫨</div>
                        <div class="text-sm text-gray-400">地震防護</div>
                        <div id="progress-earthquake" class="text-xl font-bold text-white mt-1">讀取中</div>
                    </div>
                    <div class="bg-slate-700/50 p-4 rounded-lg">
                        <div class="text-2xl mb-1">🌀</div>
                        <div class="text-sm text-gray-400">防颱整備</div>
                        <div id="progress-typhoon" class="text-xl font-bold text-white mt-1">讀取中</div>
                    </div>
                    <div class="bg-slate-700/50 p-4 rounded-lg">
                        <div class="text-2xl mb-1">🔥</div>
                        <div class="text-sm text-gray-400">火災逃生</div>
                        <div id="progress-fire" class="text-xl font-bold text-white mt-1">讀取中</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-slate-800 rounded-xl border border-blue-500/50 shadow-lg overflow-hidden">
            <div class="bg-slate-700 p-4 border-b border-slate-600 flex justify-between items-center">
                <h3 class="text-xl font-bold text-white">🕹️ 斷點情境模擬訓練室</h3>
            </div>
            
            <div class="flex border-b border-slate-600">
                <button onclick="setDisasterMode('earthquake')" id="tab-earthquake" class="flex-1 py-3 text-center font-bold bg-blue-600 text-white transition">🫨 地震情境</button>
                <button onclick="setDisasterMode('typhoon')" id="tab-typhoon" class="flex-1 py-3 text-center font-bold bg-slate-800 text-gray-400 hover:bg-slate-700 transition">🌀 颱風情境</button>
                <button onclick="setDisasterMode('fire')" id="tab-fire" class="flex-1 py-3 text-center font-bold bg-slate-800 text-gray-400 hover:bg-slate-700 transition">🔥 火災情境</button>
            </div>

            <div class="p-6">
                <p id="modeDescription" class="text-gray-300 mb-6">目前模式：地震發生時的瞬間應變與物資運用。</p>
                
                <button id="startQuizBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-6 rounded-lg transition shadow-lg mb-6">
                    🎲 啟動 AI 情境出題
                </button>

                <div id="aiQuizDisplay" class="hidden">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="bg-blue-500/20 p-2 rounded-lg text-blue-400">🤖 Gemini 導師</div>
                        <p class="text-sm text-gray-400">已為您生成專屬情境題</p>
                    </div>
                    <p id="questionText" class="text-xl font-bold mb-6 leading-relaxed"></p>
                    <div id="optionsContainer" class="flex flex-col gap-3"></div>
                    <div id="explanationBox" class="hidden mt-6 p-5 bg-slate-900 border border-slate-600 rounded-lg text-gray-200 leading-relaxed whitespace-pre-line"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. Supabase 設定
        // ==========================================
        const supabaseUrl = 'https://ovyygcsuiwwbgoywplbq.supabase.co';
        const supabaseKey = 'sb_publishable_Rfekybrmzpc7rjaHAq5Q8Q_ChnHYcAI'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        
        const testUserId = 'f0bda093-7bb6-414a-97fc-9777b97d6320'; 

        // 💡 異步中繼機制：前端改為直接向你的 Python 後端 API 要題目！
        // 週四發表在學校時，若用手機測，這裡請直接填你 Python 執行電腦的區域 IP（例如 http://192.168.1.X:5000/get_quiz）
        const BACKEND_API_URL = 'http://127.0.0.1:5000/get_quiz'; 

        // 狀態管理
        let currentMode = 'earthquake'; 

        // ==========================================
        // 2. 切換災害模式 UI
        // ==========================================
        function setDisasterMode(mode) {
            currentMode = mode;
            ['earthquake', 'typhoon', 'fire'].forEach(m => {
                document.getElementById(`tab-${m}`).className = "flex-1 py-3 text-center font-bold bg-slate-800 text-gray-400 hover:bg-slate-700 transition";
            });
            document.getElementById(`tab-${mode}`).className = "flex-1 py-3 text-center font-bold bg-blue-600 text-white transition";
            
            const descMap = {
                earthquake: "【地震情境】模擬強震突發時的斷點決策，以及避難包的緊急運用。",
                typhoon: "【颱風情境】模擬強颱登陸、長期停水停電的物資分配與居家防護。",
                fire: "【火災情境】模擬濃煙密布的逃生路線判斷，與急救物資的使用時機。"
            };
            document.getElementById('modeDescription').innerText = descMap[mode];
            document.getElementById('aiQuizDisplay').classList.add('hidden');
            document.getElementById('startQuizBtn').innerText = "🎲 產生新情境考題";
        }

        // ==========================================
        // 3. 初始化：從 Supabase 讀取資料
        // ==========================================
        async function fetchUserProgress() {
            try {
                const { data, error } = await supabaseClient.from('lms_disaster_progress').select('*').eq('user_id', testUserId).single();
                if (error) throw error;
                
                document.getElementById('scoreDisplay').innerText = data.disaster_kit_score;
                if (data.disaster_kit_score < 60) {
                    document.getElementById('statusMessage').innerText = "🔴 警告：實體物資嚴重不足";
                    document.getElementById('statusMessage').className = "mt-3 text-sm text-red-400 font-bold";
                    document.getElementById('scoreDisplay').className = "text-6xl font-extrabold text-red-500";
                } else {
                    document.getElementById('statusMessage').innerText = "🟢 實體包準備完善";
                    document.getElementById('statusMessage').className = "mt-3 text-sm text-green-400 font-bold";
                    document.getElementById('scoreDisplay').className = "text-6xl font-extrabold text-green-500";
                }

                document.getElementById('progress-earthquake').innerText = `${data.earthquake_completed_quizzes || 0} 關`;
                document.getElementById('progress-typhoon').innerText = `${data.typhoon_completed_quizzes || 0} 關`;
                document.getElementById('progress-fire').innerText = `${data.fire_completed_quizzes || 0} 關`;

            } catch (err) {
                console.error("撈取資料失敗:", err);
            }
        }
        window.onload = fetchUserProgress;

        // ==========================================
        // 4. 改向本機 Python API 請求 Gemini 題目
        // ==========================================
        document.getElementById('startQuizBtn').addEventListener('click', async () => {
            const btn = document.getElementById('startQuizBtn');
            btn.innerText = "⏳ 構建虛擬情境中...";
            btn.disabled = true;

            try {
                // 💡 丟給 Python 後端處理，順便告訴後端目前是什麼模式
                const response = await fetch(`${BACKEND_API_URL}?mode=${currentMode}`);
                if (!response.ok) throw new Error("後端連線異常");
                
                const quizData = await response.json(); 
                renderQuiz(quizData); 

            } catch (error) {
                alert("🤖 提示：請確保您的 Python 後端(sync_backend.py)正在開著運作喔！");
                console.error(error);
            } finally {
                btn.innerText = "🎲 重新產生情境";
                btn.disabled = false;
            }
        });

        // ==========================================
        // 5. 繪製題目
        // ==========================================
        function renderQuiz(quiz) {
            document.getElementById('aiQuizDisplay').classList.remove('hidden');
            document.getElementById('explanationBox').classList.add('hidden');
            document.getElementById('questionText').innerText = quiz.question;
            const container = document.getElementById('optionsContainer');
            container.innerHTML = ""; 

            quiz.options.forEach(option => {
                const optBtn = document.createElement('button');
                optBtn.className = "text-left bg-slate-700 hover:bg-slate-600 p-4 rounded-lg font-bold border border-slate-600 transition";
                optBtn.innerText = option;
                
                optBtn.onclick = async () => {
                    document.getElementById('explanationBox').classList.remove('hidden');
                    const allButtons = container.querySelectorAll('button');
                    allButtons.forEach(b => b.disabled = true);

                    if (option === quiz.correctAnswer) {
                        optBtn.className = "text-left bg-green-600/50 border-green-500 p-4 rounded-lg font-bold text-white";
                        document.getElementById('explanationBox').innerHTML = `✅ <b>決策正確！</b>\n\n<b>AI 導師回饋：</b>\n${quiz.explanation}\n\n<span class='text-green-400'>🚀 [系統同步] ${currentMode} 情境過關！正在將經驗值寫入資料庫...</span>`;
                        
                        await saveCategoryProgress(currentMode);
                    } else {
                        optBtn.className = "text-left bg-red-600/50 border-red-500 p-4 rounded-lg font-bold text-white";
                        document.getElementById('explanationBox').innerHTML = `❌ <b>危險決策！</b>\n\n<b>AI 導師回饋：</b>\n${quiz.explanation}\n\n<span class='text-yellow-400'>🔄 [系統提示] 觀念需要調整，請重新產生情境進行挑戰。</span>`;
                    }
                };
                container.appendChild(optBtn);
            });
        }

        async function saveCategoryProgress(mode) {
            const columnMap = {
                earthquake: 'earthquake_completed_quizzes',
                typhoon: 'typhoon_completed_quizzes',
                fire: 'fire_completed_quizzes'
            };
            const targetColumn = columnMap[mode];

            try {
                const { data: currentData } = await supabaseClient.from('lms_disaster_progress').select(targetColumn).eq('user_id', testUserId).single();
                let currentCount = currentData[targetColumn] || 0;

                const { error } = await supabaseClient
                    .from('lms_disaster_progress')
                    .update({ 
                        [targetColumn]: currentCount + 1,
                        updated_at: new Date().toISOString()
                    })
                    .eq('user_id', testUserId);

                if (error) throw error;
                setTimeout(fetchUserProgress, 1500);
            } catch (err) {
                console.error("更新關卡進度失敗:", err);
            }
        }
    </script>
</body>
</html>
