<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>防災萬用包 - LMS 中控台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @keyframes radar { 0% { transform: scale(0.5); opacity: 0; } 50% { opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }
        .radar-pulse { animation: radar 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1); }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex font-sans">

    <aside class="w-64 bg-slate-900 border-r border-slate-800 p-6 flex flex-col shrink-0 select-none">
        <div class="text-xl font-bold mb-10 text-blue-400">🌪️ 防災學習 LMS</div>
        
        <nav class="space-y-4 flex-1">
            <div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">主選單</div>
            <a href="#" class="flex items-center gap-3 text-blue-400 bg-blue-900/20 p-3 rounded-lg border border-blue-900/50">
                <span>📊</span> 儀表板
            </a>
            
            <div class="text-xs font-bold text-gray-500 uppercase tracking-wider mt-8 mb-2">防災知識庫</div>
            <a href="files/緊急避難包.pdf" target="_blank" class="flex items-center gap-3 text-gray-400 hover:text-white p-3 hover:bg-slate-800 rounded-lg transition">
                <span>📄</span> 緊急避難包清單
            </a>
            <a href="files/日常儲備清單.pdf" target="_blank" class="flex items-center gap-3 text-gray-400 hover:text-white p-3 hover:bg-slate-800 rounded-lg transition">
                <span>📄</span> 日常居家儲備
            </a>
        </nav>

        <div class="mt-auto border-t border-slate-800 pt-6">
            <div id="userEmailDisplay" class="text-xs text-gray-400 mb-4 truncate">🎓 載入中...</div>
            <button onclick="logout()" class="w-full text-left text-red-400 hover:text-red-300 text-sm font-bold flex items-center gap-2">
                <span>🚪</span> 登出系統
            </button>
        </div>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">
        <div class="max-w-5xl mx-auto">
            <h1 class="text-3xl font-bold mb-8">智慧防災學習中控台</h1>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-lg lg:col-span-1">
                    <div id="preparationGuideSection">
                        <h2 class="text-md font-bold text-blue-400 mb-4">📋 步驟一：實體包準備</h2>
                        <div class="space-y-3 text-sm">
                            <label class="flex items-start gap-3 bg-slate-800 p-3 rounded-lg border border-slate-700 cursor-pointer">
                                <input type="checkbox" onchange="checkPrepStatus()" class="prep-check mt-1 rounded bg-slate-700 border-slate-600">
                                <div><span class="block font-bold">1. 維持生命物資</span><span class="text-xs text-gray-400">水與三天份糧食</span></div>
                            </label>
                            <label class="flex items-start gap-3 bg-slate-800 p-3 rounded-lg border border-slate-700 cursor-pointer">
                                <input type="checkbox" onchange="checkPrepStatus()" class="prep-check mt-1 rounded bg-slate-600 border-slate-600">
                                <div><span class="block font-bold">2. 急救與防寒</span><span class="text-xs text-gray-400">藥品、保暖毯</span></div>
                            </label>
                            <label class="flex items-start gap-3 bg-slate-800 p-3 rounded-lg border border-slate-700 cursor-pointer">
                                <input type="checkbox" onchange="checkPrepStatus()" class="prep-check mt-1 rounded bg-slate-600 border-slate-600">
                                <div><span class="block font-bold">3. 求救與照明</span><span class="text-xs text-gray-400">手電筒、哨子</span></div>
                            </label>
                        </div>
                        <a id="startScanBtn" class="block text-center w-full bg-slate-700 text-gray-400 font-bold py-3 rounded-lg mt-5 pointer-events-none text-sm transition">
                            🔒 請先勾選備齊物資
                        </a>
                    </div>
                    
                    <div id="scanningWaitSection" class="hidden flex flex-col items-center py-8">
                        <div class="relative w-16 h-16 flex items-center justify-center mb-4"><div class="absolute inset-0 bg-indigo-500 rounded-full radar-pulse"></div>📱</div>
                        <p class="text-sm">喚醒 iOS 鏡頭中...</p>
                    </div>
                    <div id="scanResultSection" class="hidden flex flex-col items-center py-4">
                        <div id="scoreDisplay" class="text-5xl font-extrabold text-blue-400">--</div>
                        <p id="statusMessage" class="mt-2 text-sm text-yellow-400">讀取中...</p>
                        <button onclick="resetToPrep()" class="text-xs text-gray-500 mt-4 underline">重新盤點</button>
                    </div>
                </div>

                <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-lg lg:col-span-2">
                    <h2 class="text-lg font-bold mb-4">🧠 學習進度概況</h2>
                    <div class="grid grid-cols-3 gap-4 text-center">
                        <div class="bg-slate-800 p-4 rounded-lg"><div class="text-xl">🫨</div><div class="text-xs text-gray-400">地震</div><div id="progress-earthquake" class="font-bold">0 關</div></div>
                        <div class="bg-slate-800 p-4 rounded-lg"><div class="text-xl">🌀</div><div class="text-xs text-gray-400">防颱</div><div id="progress-typhoon" class="font-bold">0 關</div></div>
                        <div class="bg-slate-800 p-4 rounded-lg"><div class="text-xl">🔥</div><div class="text-xs text-gray-400">火災</div><div id="progress-fire" class="font-bold">0 關</div></div>
                    </div>
                </div>
            </div>

            <div class="bg-slate-900 rounded-xl border border-blue-900/50 shadow-lg p-6">
                <h3 class="text-xl font-bold mb-4">🕹️ 斷點情境模擬訓練室</h3>
                <div class="flex gap-2 mb-6">
                    <button onclick="setDisasterMode('earthquake')" id="tab-earthquake" class="flex-1 py-2 rounded-lg bg-blue-600 font-bold">地震</button>
                    <button onclick="setDisasterMode('typhoon')" id="tab-typhoon" class="flex-1 py-2 rounded-lg bg-slate-800 text-gray-400">颱風</button>
                    <button onclick="setDisasterMode('fire')" id="tab-fire" class="flex-1 py-2 rounded-lg bg-slate-800 text-gray-400">火災</button>
                </div>
                <button id="startQuizBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg">🎲 啟動 AI 情境出題</button>
                <div id="aiQuizDisplay" class="hidden mt-6">
                    <p id="questionText" class="text-lg font-bold mb-4"></p>
                    <div id="optionsContainer" class="flex flex-col gap-2"></div>
                    <div id="explanationBox" class="hidden mt-4 p-4 bg-slate-800 rounded-lg text-sm"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ... (這裡貼上你原本就已經寫好的所有 Supabase 與 logic 程式碼)
        // 為了節省空間，我省略了 JS 內部的處理，請記得把原本那一大段 <script> 區塊貼在這裡！
    </script>
</body>
</html>
